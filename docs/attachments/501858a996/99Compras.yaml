  /v1/item/item/setStock:
    post:
      tags: [Menu API]
      summary: Stock API
      description: |
        The Stock API endpoint gives you the ability to update the stock available for a certain item.
        🚨 **ATTENTION:** This function is only available for Grocery Stores (convenience stores, supermarkets, etc) and NOT available for restaurants.

        **Endpoint limitations:** Once per store every 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_token, stock_list]
              properties:
                auth_token:
                  type: string
                  description: The auth token for the shop.
                stock_list:
                  type: array
                  items:
                    type: object
                    required: [app_item_id, stock]
                    properties:
                      app_item_id:
                        type: string
                        description: The unique ID for a certain item.
                      stock:
                        type: integer
                        description: The item stock amount.
            example:
              auth_token: "MWM2Z011N2020DR1NDcxZmN1M21wNDh1MjMwNDkyNDE"
              stock_list:
                - app_item_id: "Hamburguesas01"
                  stock: 10
                - app_item_id: "Hamburguesas02"
                  stock: 20
      responses:
        "200":
          description: successful operation
