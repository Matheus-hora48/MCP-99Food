openapi: 3.0.3

info:
  title: 99Compras API
  version: 1.0.0
  description: |
    ## Bem-vindo à API de Groceries da 99Compras

    Esta documentação reúne todos os endpoints disponíveis para integração coma **99**, oferecendo um ambiente centralizado para desenvolvimento, testes e homologação.

    Ela contempla todo o fluxo da integração, desde a sincronização do catálogo até o gerenciamento completo do ciclo de vida dos pedidos.

    ### APIs recomendadas para Homologação

    Os módulos abaixo são os principais componentes que devem ser implementados e validados durante o processo de homologação:

    - **Menu API**
      - Responsável pelo gerenciamento e sincronização de categorias, produtos, preços, disponibilidade, estoque e demais informações do catálogo.

    - **Order API**
      - Responsável pelo recebimento, atualização e gerenciamento do ciclo de vida dos pedidos, incluindo aceitação, cancelamentos, atualizações de status e demais eventos relacionados.

    ### APIs Complementares

    Os demais endpoints desta documentação oferecem funcionalidades adicionais e integrações complementares. No entanto, o processo de homologação é baseado principalmente na validação completa da **Grocery Menu API** e da **Order API**.

servers:
  - url: https://openapi.99food.com

tags:
  - name: Authorization API
  - name: Store API
  - name: Menu API
  - name: Order API
  - name: Logistics API
  - name: Financial API

paths:
  /v1/auth/authtoken/get:
