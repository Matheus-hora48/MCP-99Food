        *NOTE: To use this endpoint, the store first needs to configure if it wants to receive cancellation requests (via `Store API` -> `Set Store Cancellation/Refund`).*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_token, order_id, apply_id, agree]
              properties:
                auth_token:
                  type: string
                  description: The auth_token for the shop.
                order_id:
                  type: integer
                  description: The ID of the order in 99Food's system.
                apply_id:
                  type: integer
                  description: The ID of the request sent by the orderCancelApply webhook.
                agree:
                  type: boolean
                  description: "true: agree with the request; false: refuse the request."
                reason:
                  type: string
                  description: An optional reason for the response. Select from the list provided in the orderCancelApply webhook.
