  /v1/order/events/list:
    post:
      tags: [Order API]
      summary: Order Polling
      description: |
        This endpoint polls for new events related to orders from merchants associated with the authenticated user.

        🚨 **Crucial Implementation Detail:** Each event received from this endpoint must be properly acknowledged using the Acknowledgment Endpoint (`/v1/order/events/ack`). If not acknowledged, the event will continue to be returned in subsequent polling requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_token, event_type]
              properties:
                auth_token:
                  type: string
                  description: Standard API token
                event_type:
                  type: array
                  description: "Filter for desired event types. Events not selected in this list will be automatically acknowledged and omitted from the response."
                  items:
                    type: string
                    enum:
                      [
                        CREATED,
                        CONFIRMED,
                        READY,
                        CONCLUDED,
                        CANCELLED,
                        CONSUMER_CANCELLATION_REQUESTED,
                        CONSUMER_REFUND_REQUESTED,
                      ]
            example:
              auth_token: "MzRlZjE0YzE0YWE4NGQ1Mjk4MjkxZjU4N2IyNTE5OGE="
              event_type: []
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  errno:
                    type: integer
                  errmsg:
                    type: string
                  requestId:
                    type: string
                  time:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        event_id:
                          type: integer
                        event_type:
                          type: string
                        order_id:
                          type: integer
                        create_time:
                          type: string
              examples:
                success:
                  summary: Success
                  value:
                    errno: 0
                    errmsg: "ok"
                    requestId: "s4213951698c2cc2127f6fd1fea70402"
                    time: 1770794178
                    data:
                      - event_id: 5764641142240838388
                        event_type: "CANCELLED"
                        order_id: 5764658710785887183
                        create_time: "2026-02-11T03:29:20Z"
                      - event_id: 5764641259798790914
                        event_type: "CREATED"
                        order_id: 5764658710785887183
                        create_time: "2026-02-11T03:29:12Z"

  /v1/order/events/ack:
    post:
      tags: [Order API]
      summary: Acknowledgment
      description: This endpoint allows you to acknowledge a list of events simultaneously via the request body. This is useful for processing batches of events retrieved from the polling endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_token, polling_events]
              properties:
                auth_token:
                  type: string
                  description: Standard API token
                polling_events:
                  type: array
                  description: Filter for desired event types. Events not selected in this list will be automatically acknowledged and omitted from the response.
                  items:
                    type: object
                    required: [event_id, order_id]
                    properties:
                      event_id:
                        type: integer
                        description: event_id
                      order_id:
                        type: integer
                        description: order_id
            example:
              auth_token: "MzRIZjEOYzEOYWE4NGQ1Mjk4MjkxZjU4N2IyNTE5OGE="
              polling_events:
                - event_id: 5764640420019441388
                  order_id: 5764657937880515791
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  errno:
                    type: integer
                  errmsg:
                    type: string
                  requestId:
                    type: string
                  time:
                    type: integer
                  data:
                    type: object
              examples:
                success:
                  summary: Success
                  value:
                    errno: 0
                    errmsg: "ok"
                    requestId: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6"
                    time: 1781806462
                    data: {}

  /v1/order/order/detail:
    get:
      tags: [Order API]
      summary: Get Order Details
      description: |
        This Get Order Details endpoint allows a developer to retrieve the details of a single order.

        🚨 **ATTENTION:**
        * We use long (64-bit integer) as IDs for apps, orders and stores. So please pay attention when parsing those numbers. For example, in Node.js our orderId (5764607801871631353) will be parsed as 5764607801871631000 with lib "body-parser" or "JSON.parse()". Please use json-bigint to parse it: `var jsonBig = require('json-bigint'); jsonBig.parse(data)`.
        * We'll send new order notification to the webhook provided by the Integrator to receive any new event from 99Food. Please differentiate them with type. For more details please check the documentation in Order Webhooks.
      parameters:
        - in: query
          name: auth_token
          required: true
          schema: { type: string }
          description: The auth_token for the shop.
        - in: query
          name: order_id
          required: true
          schema: { type: integer }
          description: The ID of the order in 99Food’s system.
      responses:
        "200":
          description: successful operation
          content:
