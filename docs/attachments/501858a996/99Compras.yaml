      summary: Order Verification
      description: |
        The Order Verification endpoint verifies whether the scanned offline order total falls within an acceptable range of the online order price[cite: 29].
        * **ATTENTION:** For pickup orders only[cite: 29].
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_token, order_id, offline_goods_price]
