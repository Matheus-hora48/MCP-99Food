  /v1/shop/shop/setconfirmmethod:
    post:
      tags: [Store API]
      summary: Set Store Order Confirmation Method
      description: |
        This API sets the method a store uses to confirm orders. Choose between two modes:
        * **1 (B-App & OpenAPI):** Orders can be accepted or canceled either through the 99Food Store App or your integrated system.
        * **2 (OpenAPI):** Orders must be accepted or canceled through your integrated system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_token, order_confirm_method]
              properties:
                auth_token:
                  type: string
                  description: The auth_token for the shop.
                order_confirm_method:
                  type: integer
                  description: "1: B-App & OpenAPI; 2: OpenAPI"
            example:
              auth_token: "ZGQ5ZjVIZGUyYmFhNDM2ZmE0ZDA5OTE5ZjI1YzBhNjU="
              order_confirm_method: 1
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
              examples:
                success:
                  summary: Success
                  value:
                    errno: 0
                    errmsg: "ok"
                    requestId: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d"
                    time: 1781806462
                    data:
                      order_confirm_method: true
                systemError:
