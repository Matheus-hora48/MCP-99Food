  /v1/order/order/confirm:
    post:
      tags: [Order API]
      summary: Confirm Order
      description: |
        The Confirm Order endpoint enables partners to acknowledge receipt of a 99Food order within their own system.

        **ATTENTION:** We require that the order is confirmed in 5 minutes after sending the orderNew webhook or the order will be canceled automatically by the system. The confirmation can be done either by this endpoint or by B-App, depending on the configuration set for the store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_token, order_id]
              properties:
                auth_token:
                  type: string
                  description: The auth_token for the shop.
                order_id:
                  type: integer
                  description: The ID of the order in 99Food's system.
            example:
              auth_token: "ZGQ5ZjVIZGUyYmFhNDM2ZmE0ZDA5OTE5ZjI1YzBhNjU"
              order_id: 2352921557674426622
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  errno:
                    type: integer
                  errmsg:
                    type: string
                  requestId:
                    type: string
                  time:
                    type: integer
                  data:
                    type: boolean
              examples:
                success:
                  summary: Success
                  value:
                    errno: 0
                    errmsg: "ok"
                    requestId: "7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e"
                    time: 1781806462
                    data: true

