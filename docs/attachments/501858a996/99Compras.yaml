  /v3/item/item/getGroceryMenuTaskInfo:
    get:
      tags: [Menu API]
      summary: Get Grocery Menu Task Info
      description: |
        Returns the detailed status and error information for an Upload Grocery Menu task. Because catalog uploads are asynchronous, you must poll this endpoint using the `task_id` returned by the upload API.

        ### Task Status Codes (status)
        * **0** (waiting): In queue.
        * **1** (success): Menu updated successfully.
        * **2** (failed): Fatal error, the menu was not updated. Check the `operationList` -> `failedList` array.
        * **3** (waitRetry): Processing failed temporarily, DiDiFood will auto-retry.
        * **4** (running): Currently processing.

        ### Operation Types (operationType)
        * **parameterCheck**: Validating the JSON structure parameters.
        * **uploadFile / uploadMidGift**: Uploading the middle file to the server.
        * **createUploadTask**: Calling the underlying core item interface.
        * **imageUpdate**: Downloading and checking images.
        * **imageCheck**: Validating if the head image satisfies requirements.
        * **uploadTaskDone / uploadFinish**: Upload menu has been completely finished.

        ### Complete Upload Task Errors (Errno)
        If the task fails (status 2), the `failedList` array will contain a stringified JSON `message` with the following error codes mapping to what went wrong in your payload:

        | Errno | Reason | Description |
        |---|---|---|
        | **80101** | ERRNO_TASK_SYS_ERR | The system has errors |
        | **80102** | ERRNO_EXT_MENU_ID_IS_EMPTY | The app_menu_id of this menu is empty |
        | **80103** | ERRNO_EXT_CATE_ID_IS_EMPTY | The app_category_id of this category is empty |
        | **80104** | ERRNO_EXT_ITEM_ID_IS_EMPTY | The app_item_id of this item is empty |
        | **80106** | ERRNO_EXT_MODIFIER_GROUP_ID_IS_EMPTY | The app_modifier_group_id of this modifier group is empty |
        | **80107** | ERRNO_CATE_NAME_HAS_SENSITIVE_WORD | The name of this category has sensitive words |
        | **80108** | ERRNO_CATE_EXT_ID_COUNT | The app_category_id is over the length limit |
        | **80109** | ERRNO_ITEM_NAME_HAS_SENSITIVE_WORD | The name of this item has sensitive words |
        | **80111** | ERRNO_ITEM_DESC_HAS_SENSITIVE_WORD | The description of this item has sensitive words |
        | **80112** | ERRNO_ITEM_PRICE_MODIFY_VERIFICATION_FAILED | The price of this item didn't pass the modifying verification |
        | **10016** | ERR_ITEMNAME_OVER_COUNT | The item name is over the length limit |
        | **10037** | ERR_ITEMDESC_OVER_COUNT | The description of the item is over the length limit |
        | **55081** | ERROR_SHOW_SHOP_NOT_EXIST | The shop doesn't exist |
        | **10027** | ERR_ITEM_PRICE_ILLEGAL | The item price doesn't meet the platform standard |
        | **80114** | ERRNO_ILLEGAL_ITEM_STATUS | The item status doesn't meet the platform standard |
        | **58083** | ERROR_SHOW_SOLDINFO_ILLEGAL | The sell information doesn't meet the platform standard |
        | **58065** | ERROR_SHOW_SOLDINFO_DAY_ILLEGAL | The information of the available for sale date doesn't meet the platform standard |
        | **59082** | ERROR_SHOW_SOLDINFO_COUNT | The sell information is over the length limit |
        | **58084** | ERROR_SHOW_SOLDINFO_BEGINEND_ILLEGAL | The beginning and end time of the sell info doesn't meet the standard |
        | **80116** | ERR_SOLD_INFO_TIME_CONTAINS_INTERSECTION | The selling time has a conflict |
        | **10041** | ERR_ITEM_EXT_ID_COUNT | The item ext id is over the length limit |
        | **10043** | ERR_ITEM_NOT_EXIST | The item doesn't exist |
        | **80115** | ERRNO_MODIFIER_GROUP_NOT_EXIST | The modifier group doesn't exist |
        | **16362** | ERRNO_ITEM_TOTAL_NUM_EXCEEDS_LIMIT | The total number of items/items within a category exceeds the limit |
        | **80117** | ERRNO_CATE_IN_CATE_NUM_EXCEEDS_LIMIT | The total number of subcategories within a category exceeds the limit |
        | **10051** | ERR_ITEM_LEVEL_TO_MUCH | The level of the items didn't pass the verification |
        | **80118** | ERROR_SHOP_BUSINESS_TYPE | Errors when obtaining business type / Shop has a nonaffiliate menu |
        | **80120** | ERRNO_SHOP_MENU_BUSINESS_TYPE_NOT_MATCH | The menu does not match the business type of the shop |
        | **80121** | ERRNO_SHOP_CATE_BUSINESS_TYPE_NOT_MATCH | The category does not match the business type of the shop |
        | **80122** | ERRNO_SHOP_ITEM_BUSINESS_TYPE_NOT_MATCH | The item does not match the business type of the shop |
        | **80125** | ERRNO_SHOP_BRAND_NOT_MATCH | The brand does not match the shop |
        | **80126** | ERRNO_MENU_BUSINESS_TYPE_NOT_SUPPORT | The business type of the menu is not supported |
        | **80127** | ERRNO_MENU_NOT_EXIST | The menu does not exist |
        | **80128** | ERRNO_CATE_NOT_EXIST | The category does not exist |
        | **80129** | ERRNO_DUPLICATE_CATE_ID | The category id is duplicated |
        | **80130** | ERRNO_DUPLICATE_ITEM_ID | The item id is duplicated |
        | **80131** | ERRNO_DUPLICATE_MODIFIER_GROUP_ID | The modifier group id is duplicated |
        | **80132** | ERRNO_DUPLICATE_ITEM_IN_MENU | The menu appears duplicate items |
        | **80133** | ERRNO_DUPLICATE_ITEM_IN_MODIFIER_GROUP | The modifier group has duplicate items |
        | **80134** | ERRNO_DUPLICATE_MODIFIER_GROUP_IN_ITEM | The item has duplicate modifier groups |
        | **80135** | ERRNO_MENU_IS_EMPTY | The menu is empty |
        | **80136** | ERRNO_CATE_IS_EMPTY | The category is empty |
        | **80137** | ERRNO_SUBCATE_ITEM_IN_CATE | Both subcategories and items directly bound to the category at same time |
        | **80138** | ERRNO_MENU_NAME_OVER_COUNT | The name of the menu is over the length limit |
        | **80139** | ERRNO_CATE_NAME_OVER_COUNT | The name of the category is over the length limit |
        | **80140** | ERRNO_MODIFIER_GROUP_NAME_OVER_COUNT | The name of the item/modifier is over the length limit |
        | **80141** | ERRNO_TASK_PARAM_ERR | The task parameters have errors |
        | **80142** | ERRNO_SHOP_CITY_NOT_MATCH | The shop does not match the city |
        | **80143** | ERRNO_SHOP_COUNTRY_NOT_MATCH | The shop does not match the country |
        | **80144** | ERRNO_CATE_NAME_NOT_IN_LIST | The category name is not in the optional allowed names range |
        | **10343** | ERR_CATE_LEVEL_TO_MUCH | The category level exceeds the limit |
        | **80345** | ERRNO_ILLEGAL_ENUM | There are errors in enumeration value verification |
        | **80147** | ERRNO_MENU_EXT_ID_COUNT | The menu ext id is over the length limit |
        | **80148** | ERRNO_MG_EXT_ID_COUNT | The multiplier-group ext id is over the length limit |
        | **80149** | ERRNO_ITEM_HAS_RING | The structure contains a circular reference (e.g., an item is its own sub-item) |

      parameters:
        - in: query
          name: auth_token
          required: true
          schema: { type: string }
          description: The auth token for the shop.
        - in: query
          name: task_id
          required: true
          schema: { type: integer }
          description: ID of the task returned in the upload response.
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  errno:
                    type: integer
                  errmsg:
                    type: string
                  requestId:
                    type: string
                  time:
                    type: integer
                  data:
