  /v1/promo/promo/uploadGrocery:
    post:
      tags: [Menu API]
      summary: Upload Grocery Promo Activity
      description: |
        The Upload Grocery Promo Activity endpoint allows the developer to upload grocery promo activity.

        ### Activity Types (activity_type)
        * **2**: Special price (requires **discount_perc** or **discount_amount**).
        * **4**: Buy X get Y (requires **buy_num** and **get_num**).
        * **8**: Buy X for $Y (requires **bxgy_x** and **bxgy_y**).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_token, app_item_id_type, promo_list]
              properties:
                auth_token:
                  type: string
                  description: "The auth token for the shop."
                app_item_id_type:
                  type: integer
                  description: "External Dish to Internal Dish Conversion Methods. 0: app_item_id; 1: upc."
                promo_list:
                  type: array
                  description: "A list of promo."
                  items:
                    type: object
                    required: [action, activity_id]
                    properties:
                      action:
                        type: integer
                        description: "Operation Type. 1: Create activity, 2: Stop activity."
                      activity_id:
                        type: string
                        description: "Activity ID."
                      activity_type:
                        type: integer
                        description: "Activity Type. 2: special price; 4: buy X get Y; 8: buy X for $Y."
                      activity_name:
                        type: string
                        description: "Activity name. Optional; defaults to activity_id if not provided. Required when action=1."
                      start_date:
                        type: string
                        description: "Activity start time. Date string, format: YYYY-MM-DD HH:MM:SS. Required when action=1."
                      end_date:
                        type: string
                        description: "Activity end time. Date string, format: YYYY-MM-DD HH:MM:SS. Required when action=1."
                      item_activity_list:
                        type: array
                        description: "List of all dishes and discount information participating in this activity. Required when action=1."
                        items:
                          type: object
                          properties:
                            app_item_id:
                              type: string
                              description: "External Dish to Internal Dish Conversion Methods."
                            discount_perc:
                              type: integer
                              description: "Discount - Percentage. Integer, range: 5 <= discount_perc < 100. When action=1 and activity_type=2, at least one of discount_amount or discount_perc must be provided."
                            discount_amount:
                              type: integer
                              description: "Discount - Fixed amount reduction (in the smallest currency unit). When action=1 and activity_type=2, at least one of discount_amount or discount_perc must be provided. Amount is set in the smallest local currency unit (e.g., Brazilian Real in centavos, not reais)."
                            buy_num:
                              type: integer
                              description: "The buy quantity in a Buy X Get Y promotion. Required when action=1 and activity_type=4."
                            get_num:
                              type: integer
                              description: "The get quantity in a Buy X Get Y promotion. Required when action=1 and activity_type=4."
                            bxgy_x:
                              type: integer
                              description: "The X value in a Buy X Get Y off promotion (e.g., buy X items). Required when action=1 and activity_type=8."
                            bxgy_y:
                              type: integer
                              description: "The Y value in a Buy X Get Y off promotion (e.g., save Y amount). Required when action=1 and activity_type=8. Y amount is set in the smallest local currency unit."
            example:
              auth_token: "Yj1hNDM2NmUyYzYxNmE5YmNjMzUzNGU3YWQxNTkwNDM"
              app_item_id_type: 0
              promo_list:
                - action: 1
                  activity_type: 2
                  activity_id: "api商超_002"
                  start_date: "2025-10-23 00:00:00"
                  end_date: "2025-12-23 23:59:59"
                  item_activity_list:
                    - app_item_id: "item025"
                      discount_perc: 30
                - action: 1
                  activity_type: 4
                  activity_id: "api商超_买赠001"
                  start_date: "2025-10-23 00:00:00"
                  end_date: "2025-12-23 23:59:59"
                  item_activity_list:
                    - app_item_id: "item099"
                      buy_num: 2
                      get_num: 3
                - action: 1
                  activity_type: 8
                  activity_id: "api商超_多买多省001"
                  start_date: "2025-10-23 00:00:00"
                  end_date: "2025-12-23 23:59:59"
                  item_activity_list:
                    - app_item_id: "sx20"
                      bxgy_x: 2
                      bxgy_y: 7000
                - action: 2
                  activity_id: "api商超_002"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                type: object
                properties:
                  errno:
                    type: integer
                  errmsg:
                    type: string
                  requestId:
                    type: string
                  time:
                    type: integer
                  data:
                    type: object
                    properties:
                      taskID:
                        type: integer
                      createTime:
                        type: integer
                      status:
                        type: integer
                      message:
                        type: string
              examples:
                success:
                  summary: Success
                  value:
                    errno: 0
                    errmsg: "ok"
                    requestId: "s351515369bbb71d0d6006e0a1227d02"
                    time: 1773909789
                    data:
                      taskID: 5764644057718326571
                      createTime: 1773909789
                      status: 0
                      message: "waiting"
                systemError:
                  summary: Error 10001 - System error
                  value:
                    errno: 10001
                    errmsg: "System error."
                    requestId: "7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e"
                    time: 1781806462
                    data: {}
                parameterError:
                  summary: Error 10002 - Parameter error
                  value:
                    errno: 10002
