      tags: [Authorization API]
      summary: Get Token
      description: This api provides the ability to get the auth token for the shop specified with app_shop_id. If you don't have a auth token yet or the auth token expired, please call auth/authtoken/refresh api first.
      parameters:
        - in: query
          name: app_id
          required: true
          schema: { type: string }
          description: ID for an app on Didi-food.
        - in: query
          name: app_secret
          required: true
          schema: { type: string }
          description: The secret key for app_id.
        - in: query
          name: app_shop_id
          required: true
          schema: { type: string }
          description: ID for an shop on your system.
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
              examples:
                success:
                  summary: Success
                  value:
                    errno: 0
                    errmsg: "ok"
                    requestId: "f82b1c4d9a3e4f71a0b6d2c8e5f9a1b4"
                    time: 16796764
                    data:
                      app_id: 42923096
                      app_shop_id: "<app_shop_id>"
                      auth_token: "<auth_token>"
                      token_expiration_time: 38384630
                systemError:
                  summary: Error 10001 - System error
                  value:
                    errno: 10001
                    errmsg: "System error."
                    requestId: "7c9d2b5a1f4e8d0c3a6b9f2e4d7c1a5b"
                    time: 1781801042
                    data: {}
                parameterError:
                  summary: Error 10002 - Parameter error
