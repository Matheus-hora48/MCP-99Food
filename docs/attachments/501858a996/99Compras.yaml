  /v3/item/item/uploadGrocery:
    post:
      tags: [Menu API]
      summary: Upload Store Menu Details
      description: |
        Uploads, updates, merges or overrides existing catalog/menu with an async task in the background.
        🚨 **IMPORTANT:** This system allows for two levels of nested categories. If a category already contains subcategories (level 2), the top-level category (level 1) cannot have items directly within it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_token, merge_policy, menus, categories, items]
              properties:
                auth_token:
                  type: string
                  description: The auth token for the shop.
                merge_policy:
                  type: integer
                  description: "1: Update (supported); 2: Override (Not currently supported)."
                menus:
                  type: array
                  description: Maximum 1 catalog/menu supported.
                  items:
                    type: object
                categories:
                  type: array
                  description: Max 30 categories. Max 30 subcategories per category.
                  items:
                    type: object
                items:
                  type: array
                  description: Max 4000 items per category. Max 30000 total.
                  items:
                    type: object
            example:
              auth_token: "Y2MyMzNhOThhNzYyMGQ3M2M1NTM0ZDlhY2RmYzM3NGE="
              merge_policy: 1
              menus:
                - menu_name: "Grocery_sample_1"
                  app_menu_id: "Grocery DiDiFood Sample"
                  app_category_ids:
                    - "Cate_Grocery_1"
                    - "Cate_Grocery_2"
              categories:
                - app_category_id: "Cate_Grocery_1"
                  category_name: "Bebidas"
                  app_item_ids:
                    - "sample_item_1"
                    - "sample_item_2"
