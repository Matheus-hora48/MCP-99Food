              apply_id: 1152921650610635594
              agree: false
              reason: "already prepare"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
              examples:
                success:
                  summary: Success
                  value:
                    errno: 0
                    errmsg: "ok"
                    requestId: "7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e"
                    time: 1781806462
                    data: {}

