  /v1/order/order/cancel:
    post:
      tags: [Order API]
      summary: Cancel Order
      description: |
        The Cancel Order endpoint allows partners to cancel an order that was previously received from 99Food.

        🚨 **CRITICAL FOR SUPPORT:** Do not use "Other reason" (ID: 1080) with a blank description. A specific reason is required for us to effectively track, analyze, and assist with cancellation-related issues.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_token, order_id, reason_id]
              properties:
                auth_token:
                  type: string
                  description: The auth_token for the shop.
                order_id:
                  type: integer
                  description: The ID of the order in 99Food's system.
                reason_id:
                  type: integer
                  description: |
                    The ID of the reason for canceling the order. Allowed values:
                    * `1010`: Item sold out (All)
                    * `1020`: Store closed for the day (All)
                    * `1030`: Store too busy to prepare order (All)
                    * `1040`: Major accident or utility outage (All)
                    * `1050`: Canceled due to customer issue (All)
                    * `1060`: No courier available (Self-delivery ONLY)
                    * `1070`: Menu needs to be updated (All)
                    * `1071`: Order is outside the delivery area (Self-delivery ONLY)
                    * `1072`: Order address is in an unsafe area (Self-delivery ONLY)
                    * `1073`: Suspected fraud or prank (All)
                    * `1074`: Questions about fees or promotions (All)
                    * `1080`: Other reason (All)
                reason:
                  type: string
                  description: Additional details about the cancellation. Strongly recommended when reason_id is 1080.
            example:
              auth_token: "ZGQ5ZJVIZGUyYmFhNDM2ZmE0ZDA5OTE5ZjI1YzBhNjL"
              order_id: 2352921557674426622
              reason_id: 1030
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
              examples:
                success:
                  summary: Success
                  value:
                    errno: 0
                    errmsg: "ok"
                    requestId: "3e1f9a4c7b2d5e8a0c6f3b9d1e4a7c2f"
                    time: 1781806462
                    data: {}

