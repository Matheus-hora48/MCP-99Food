                  type: string
                  description: "The auth_token for the shop[cite: 29]."
                order_id:
                  type: integer
                  description: "The ID of the order in 99Food's system[cite: 29]."
                offline_goods_price:
                  type: integer
                  description: "The total sum of money for the goods that were scanned offline[cite: 29]. Note: Price is always an integer value (never decimals) because the price is set in the lowest denomination (e.g. cents for MX currency, not Peso)[cite: 29]."
                picker_id:
                  type: integer
                  description: "The ID of the picker for this order[cite: 29]."
                cashier_id:
                  type: integer
                  description: "The ID of the cashier in the store[cite: 29]."
