  /v1/shop/deliveryArea/add:
    post:
      tags: [Logistics API]
      summary: Add Delivery Area
      description: |
        The Add Delivery Area endpoint adds a delivery area around the store address that can be set as a polygon or circle. It returns the IDs of the areas created that can be used to later update or delete them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  auth_token,
                  area_type,
                  avg_delivery_eta,
                  enable_time_list,
                  price,
                ]
              properties:
                auth_token:
                  type: string
                  description: "The auth_token for the shop."
                area_type:
                  type: integer
                  description: "The shape of the area drawn for the delivery area. 0: Circle; 1: Polygon with points."
                radius:
                  type: integer
                  description: "The radius of a circle delivery area in kilometers. Required when area_type is circle."
                points:
                  type: array
                  description: "List of latitude and longitude for each point of a polygon delivery area. Required when area_type is polygon."
                  items:
                    type: object
                    properties:
                      lat:
                        type: number
                      lng:
                        type: number
                avg_delivery_eta:
                  type: integer
                  description: "The average delivery ETA in seconds."
                enable_time_list:
                  type: array
                  description: "The continuous time span for the current configuration. Time format: HH:mm. Accepted values: from 00:00 to 23:59."
                  items:
                    type: object
                    properties:
                      start:
                        type: string
                      end:
                        type: string
                price:
                  type: integer
                  description: "The delivery price to be charged. Note: Price is always an integer value (never decimals) because the price is set in the lowest denomination (e.g. cents for MX currency, not Peso)."
            examples:
              circleArea:
                summary: "Area_type: Circle"
                value:
                  auth_token: "ZGQ5ZjVlZGUyYmFhNDM2ZmE0ZDA5OTE5ZjI1YzBhNjU="
                  area_type: 0
                  avg_delivery_eta: 300
                  enable_time_list:
                    - start: "00:50"
                      end: "05:00"
                    - start: "06:50"
                      end: "10:00"
                  price: 500
                  radius: 5
              polygonArea:
                summary: "Area_type: Polygon"
                value:
                  auth_token: "ZGQ5ZjVlZGUyYmFhNDM2ZmE0ZDA5OTE5ZjI1YzBhNjU="
                  area_type: 1
                  avg_delivery_eta: 300
                  enable_time_list:
                    - start: "00:50"
                      end: "05:00"
                    - start: "06:50"
                      end: "10:00"
                  price: 500
                  points:
                    - lat: 33.670702244105
                      lng: 135.5216506
                    - lat: 33.670447501144
                      lng: 135.52397561119
                    - lat: 33.669700628224
                      lng: 135.5261421767
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                type: object
                properties:
                  errno:
                    type: integer
                  errmsg:
                    type: string
                  requestId:
                    type: string
                  time:
                    type: integer
                  data:
                    type: object
                    properties:
                      area_id_list:
                        type: array
                        items:
                          type: integer
              examples:
                success:
                  summary: "Success"
                  value:
                    errno: 0
                    errmsg: "ok"
                    requestId: "1e11bfda4f8e51d1"
                    time: 1628498382
                    data:
                      area_id_list:
                        - 3458764754171136000
                        - 3458764704095340500
                systemError:
                  summary: "Error 10001 - System error"
                  value:
                    errno: 10001
                    errmsg: "System error."
                    requestId: "7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e"
                    time: 1628498382
                    data: {}
                parameterError:
                  summary: "Error 10002 - Parameter error"
                  value:
                    errno: 10002
