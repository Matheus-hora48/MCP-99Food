  /v3/item/item/updateItems:
    post:
      tags: [Menu API]
      summary: Batch Add/Update Grocery Items
      description: |
        The Batch Add/Update Grocery Items endpoint allows Partners to add or update multiple grocery items in a store's menu. This operation is asynchronous and returns a task Id for tracking.

        **Promotion Note:**
        To set a promotion, use the `activity_price` key. The difference between `price` and `activity_price` must be >= 1%. To remove a promotion, adjust the values and re-submit. 
        *Promotions are NOT permitted for items tagged as TOBACCO.*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_token, item_list]
              properties:
                auth_token:
                  type: string
                  description: The auth token for the shop
                item_list:
                  type: array
                  description: The array of items to add/update
                  items:
                    type: object
                    required: [app_item_id, upc, item_name, price, status]
                    properties:
                      app_item_id:
                        type: string
                        description: ID for the item provided by the store. Must be unique.
                      upc:
                        type: string
                        description: The barcode or UPC of the item. Max 14 digits.
                      app_external_id:
                        type: string
                        description: Free-form text/json field reserved for the Grocery's use.
                      item_name:
                        type: string
                        description: Item name to be displayed. Max length 50 characters.
                      short_desc:
                        type: string
                        description: An optional description for the item. Max 400 chars.
                      head_img:
                        type: string
                        description: URL for the item's image (SSL, <10MB, min 150px, max 3000px, JPEG/PNG).
                      price:
                        type: integer
                        description: The price to charge (lowest denomination, e.g. cents).
                      activity_price:
                        type: integer
                        description: The discounted price. DiDiFood does not recognize '0' as valid.
                      item_tags:
                        type: array
                        items:
                          type: integer
                        description: "Tags: 1=TOBACCO, 2=WINE, 4=SEX PRODUCT."
                      status:
                        type: integer
                        description: "Status in C-App: 1=Available, 2=Unavailable."
                      sold_info_intl:
                        type: array
                        items:
                          type: object
                          properties:
                            time:
                              type: array
                              items:
                                type: object
                                properties:
                                  begin:
                                    type: string
                                  end:
                                    type: string
                            day:
                              type: array
                              items:
                                type: integer
                            specialDay:
                              type: array
                              items:
                                type: string
            example:
              auth_token: "YTcwMzUwZj3jkzdmjMDIxZWMIZTAXZTXBMFmOW"
              item_list:
                - item_name: "Sprite 355ml"
                  upc: "dani11224"
                  short_desc: "Sweet white lemon flavored drink in can of 355ml"
                  price: 2000
                  activity_price: 1900
                  status: 2
                  app_item_id: "sample_item_37"
                  app_category_id: "5764608132001825189"
                  head_img: "https://img-hxy021.didistatic.com/static/starimg/img/hTTrXF9MRF.jpeg"
                  sold_info_intl:
                    - time: []
                      specialDay: ["2025-08-08"]
                    - time:
                        - begin: "02:00"
                          end: "19:00"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
              examples:
                success:
                  summary: Success
                  value:
                    errno: 0
                    errmsg: "ok"
                    requestId: "8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c"
                    time: 1781806462
                    data:
                      taskID: 5764653688083579443
                      status: 0

