  /v3/auth/authorization/shopBind:
    post:
      tags: [Store API]
      summary: Bind Store
      description: The Bind Store endpoints give you the ability to bind a store to your app when needed, without having to request it from 99Food's team. The Bind Store endpoint provides the ability to bind 50 stores at the same time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, timestamp, sign, shop_infos]
              properties:
                app_id:
                  type: integer
                  description: The ID of an app in our system.
                timestamp:
                  type: integer
                  description: Timestamp of the request.
                sign:
                  type: string
                  description: Signature generated as explained in the documentation.
                shop_infos:
                  type: array
                  description: Stores that you want to bind. Supported maximum of shop_infos is 50.
                  items:
                    type: object
                    required: [shop_id, app_shop_id]
                    properties:
                      shop_id:
                        type: integer
                        description: The unique store identifier in our system. Must not be duplicate or blank.
                      app_shop_id:
                        type: string
                        description: The unique store identifier in your system. Must not be duplicate or blank.
            example:
              app_id: 3458764610605350993
              timestamp: 1600334446
              sign: "23a3170ae0104c7d1cc3061b29f1138f"
              shop_infos:
                - shop_id: 1152921645439779073
                  app_shop_id: "001"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
              examples:
                success:
                  summary: Success
                  value:
                    errno: 0
                    errmsg: "ok"
                    requestId: "f82b1c4d9a3e4f71a0b6d2c8e5f9a1b4"
                    time: 1781806462
                    data:
                      success_list:
                        - shop_id: 3458764614711902464
                          app_shop_id: "123"
                          auth_token: "NGQyYWVlYmNkZTQ1NGI2Y2YxOTI5OGVkZWJhMGM0ODI="
                          token_expiration_time: 1648685070
                      failure_list:
                        - shop_id: 1152921673202184100
                          app_shop_id: "1234"
                          reason: "app_shop_id couldn't be duplicate"
                systemError:
                  summary: Error 10001 - System error
                  value:
                    errno: 10001
                    errmsg: "System error."
                    requestId: "9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c"
                    time: 1781806462
                    data: {}
                parameterError:
                  summary: Error 10002 - Parameter error
                  value:
                    errno: 10002
                    errmsg: "Parameter error."
                    requestId: "5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a"
                    time: 1781806462
                    data: {}
                permissionDenied:
                  summary: Error 10006 - Permission denied
