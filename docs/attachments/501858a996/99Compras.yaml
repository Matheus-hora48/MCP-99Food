  /v1/shop/shop/update:
    post:
      tags: [Store API]
      summary: Update Store Information
      description: The Update Store Information endpoint allows a developer to update the shop's basic information with optional fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_token]
              properties:
                auth_token:
                  type: string
                  description: The auth token for the shop.
                shop_phone:
                  type: array
                  description: A json structure of the phone number of the store.
                  items:
                    type: object
                    required: [callingCode, phone, type]
                    properties:
                      callingCode:
                        type: integer
                        description: The country code of the phone number.
                      phone:
                        type: integer
                        description: The phone number of the store. Can't be 0.
                      type:
                        type: integer
                        description: "0: Mobile phone (default); 1: Landline."
                biz_day_time:
                  type: array
                  description: Days and times when the store will be set as open.
                  items:
                    type: object
                    required: [biz_day, biz_time]
                    properties:
                      biz_day:
                        type: array
                        items:
                          type: integer
                        description: Days in which the store is open. Accepted values from 1 (Monday) to 7 (Sunday).
                      biz_time:
                        type: array
                        items:
                          type: object
                          required: [begin, end]
                          properties:
                            begin:
                              type: string
                              description: Format HH:mm
                            end:
                              type: string
                              description: Format HH:mm
                biz_holiday_time:
                  type: array
                  items:
                    type: object
                    required: [bizDate, restAllDay]
                    properties:
                      bizDate:
                        type: string
                        description: "Date format: yyyy-MM-dd"
                      restAllDay:
                        type: boolean
                        description: "true: closed entire day; false: follow biz_time"
                      biz_time:
                        type: array
                        items:
                          type: object
                          properties:
                            begin:
                              type: string
                            end:
                              type: string
                promise_produce_time:
                  type: integer
                  description: The average amount of time in seconds the store needs to prepare the orders.
                shop_logo:
                  type: string
                  description: The URL for the logo of the store (HTTPS, < 10MB).
                shop_head_img:
                  type: string
                shop_front_photo:
                  type: string
                shop_surrounding_photo:
                  type: string
                building_entrance_photo:
                  type: string
                main_category_ids:
                  type: object
                  required: [mainCategoryId]
                  properties:
                    mainCategoryId:
                      type: string
                    secondCategory:
                      type: string
                    thirdCategory:
                      type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
              examples:
                success:
                  summary: Success
                  value:
                    errno: 0
                    errmsg: "ok"
                    requestId: "3e1f9a4c7b2d5e8a0c6f3b9d1e4a7c2f"
                    time: 1781806462
                    data:
                      shop_phone: true
                      biz_day_time: true
                      promise_produce_time: true
                systemError:
                  summary: Error 10001 - System error
                  value:
